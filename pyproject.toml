[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-kit"
version = "0.1.0"
description = "Trustworthy evaluation infrastructure for autonomous AI agents: reproducibility fingerprinting, regression gating, and calibration-aware grading."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Stefan Song", email = "ssf0409@gmail.com" }
]
keywords = [
    "ai",
    "agents",
    "evaluation",
    "llm",
    "llm-as-judge",
    "testing",
    "regression-testing",
    "reproducibility",
    "agentic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/ssf0409/eval-kit"
Repository = "https://github.com/ssf0409/eval-kit"
Issues = "https://github.com/ssf0409/eval-kit/issues"
Changelog = "https://github.com/ssf0409/eval-kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = [
    "openai>=1.0",
    "anthropic>=0.18",
    "litellm>=1.0",
]
http = [
    "httpx>=0.25",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "httpx>=0.25",
]

[project.scripts]
eval-kit = "eval_kit.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
