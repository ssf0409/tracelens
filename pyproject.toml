[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tracelens"
dynamic = ["version"]
description = "Friendly evaluation and regression-testing framework for AI agents: inspectable traces, graded outcomes, baseline comparisons, and CI-ready reliability signals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Stefan Song", email = "ssf0409@gmail.com" }
]
keywords = [
    "ai",
    "agents",
    "evaluation",
    "llm",
    "llm-as-judge",
    "testing",
    "regression-testing",
    "reproducibility",
    "agentic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/ssf0409/tracelens"
Repository = "https://github.com/ssf0409/tracelens"
Issues = "https://github.com/ssf0409/tracelens/issues"
Changelog = "https://github.com/ssf0409/tracelens/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# NOTE: TraceLens no longer ships a built-in third-party provider wrapper.
# The [llm] extra is retained as a convenience bundle of the SDKs users
# commonly pull in when they subclass LLMProvider themselves.
llm = [
    "openai>=1.0",
    "anthropic>=0.18",
]
http = [
    "httpx>=0.25",
]
datasets = [
    "datasets>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "httpx>=0.25",
    "scipy-stubs>=1.10",
    "types-jsonschema>=4.0",
    "pyyaml>=6.0",  # validates the generated CI workflow in tests
]
# Documentation site (MkDocs Material). Build locally with `make docs-serve`.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
tracelens = "tracelens.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
exclude = [
    "/CLAUDE.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Baseline ignores — cleanup tracked as follow-up work.
# - E501: 23 pre-existing long lines (HTML/SVG literals in generator.py,
#   long test constructor calls). Re-enable after a targeted line-wrap pass.
# - UP042: 7 `class X(str, Enum)` definitions that could become `StrEnum`.
#   Deferred because StrEnum is Python 3.11+ and changing the bases is
#   a minor but visible API change for downstream code.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
