services:
  # Unit tests
  test:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    command: uv run pytest tests/ -v --tb=short

  # Run tests with coverage
  test-coverage:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./coverage:/app/coverage
    command: uv run pytest tests/ -v --cov=eval_kit --cov-report=html:coverage/html --cov-report=term-missing

  # Type checking with mypy
  type-check:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src:ro
    command: uv run mypy src/eval_kit/ --ignore-missing-imports

  # Linting with ruff
  lint:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    command: uv run ruff check src/ tests/

  # Interactive development shell
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    command: /bin/bash
    stdin_open: true
    tty: true
