name: Release

# Tag-driven releases: pushing vX.Y.Z builds package version X.Y.Z, publishes
# it to PyPI, then creates the matching GitHub Release from the changelog
# section. Nothing is published unless the build, the tag/version check, and
# the release notes all succeed first, and no GitHub Release is created
# unless PyPI publication succeeded.
#
# Dry run: "Run workflow" (workflow_dispatch) on any branch or tag runs only
# the build job: it builds, verifies, renders the release notes into the job
# summary, and publishes nothing. With publish=true on a tag it is a real
# release; release-tag.yml uses that after tagging a merged release pull
# request (a tag pushed by a workflow raises no tag-push event).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish for real (tags only). Leave off for a dry run."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build, verify, render notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Read the built version and verify it matches the tag
        id: version
        run: |
          python - <<'PY'
          import email.parser
          import os
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("tracelens-*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(
                  name for name in zf.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = email.parser.Parser().parsestr(
                  zf.read(metadata_name).decode()
              )
          version = metadata["Version"]
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/"):
              tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              if version != tag:
                  raise SystemExit(
                      f"tag v{tag} does not match built package version {version}"
                  )
              print(f"release version verified: {version}")
          else:
              print(f"dry run on {ref}: built version {version}")
          prerelease = subprocess.run(
              [sys.executable, "scripts/release_notes.py", "--version", version,
               "--print", "prerelease"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"prerelease={prerelease}\n")
          print(f"prerelease: {prerelease}")
          PY

      # The release must tell the changelog's story: a tag whose version has
      # no dated section fails here, before anything is published. A dry run
      # falls back to the [Unreleased] section and labels it as such.
      - name: Render release notes from CHANGELOG.md
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" != "true" ]; then
            python scripts/release_notes.py --version "${{ steps.version.outputs.version }}" \
              --output dist/release-notes.md --allow-unreleased
          else
            python scripts/release_notes.py --version "${{ steps.version.outputs.version }}" \
              --output dist/release-notes.md
          fi
          {
            echo "## Release notes preview (v${{ steps.version.outputs.version }}, prerelease=${{ steps.version.outputs.prerelease }})"
            echo
            cat dist/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/

      - name: Keep only the package files
        run: rm -f dist/release-notes.md && ls -la dist/

      # skip-existing makes a full re-run of an already-published tag succeed
      # (PyPI already has these exact files) instead of failing, so the
      # GitHub Release job below can still run; a genuinely different file
      # for a published version is still rejected by PyPI.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    name: create GitHub Release
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist/

      # Idempotent: a re-run after a failed or partial attempt updates the
      # existing release (notes and files) instead of failing on "already
      # exists". --verify-tag refuses to create a release for a tag that is
      # not on the remote.
      - name: Create or update the GitHub Release
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists; updating notes and files"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes-file dist/release-notes.md "${FLAGS[@]}" --prerelease="$PRERELEASE"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.whl dist/*.tar.gz
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes-file dist/release-notes.md --verify-tag "${FLAGS[@]}" \
              dist/*.whl dist/*.tar.gz
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,assets \
            --jq '"created: \(.url) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
