name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import email.parser
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheel = next(Path("dist").glob("tracelens-*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(
                  name for name in zf.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = email.parser.Parser().parsestr(
                  zf.read(metadata_name).decode()
              )
          version = metadata["Version"]
          if version != tag:
              raise SystemExit(
                  f"tag v{tag} does not match built package version {version}"
              )
          print(f"release version verified: {version}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
