name: Release prepare

# First half of the release pipeline (issue #88). One click starts a release:
# the version is validated, the changelog's [Unreleased] section becomes a
# dated release section, and the release pull request is opened with the
# rendered notes as its description. Nothing here tags, publishes, or touches
# PyPI: merging that pull request does (release-tag.yml -> release.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release: X.Y.Z, or X.Y.ZrcN / X.Y.Z.devN for a pre-release"
        required: true
        type: string
      summary:
        description: "Optional one-paragraph summary placed above the changelog entries"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: open the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the release branch
      pull-requests: write   # open the pull request
      actions: write         # run ci.yml on the branch
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SUMMARY: ${{ inputs.summary }}
    steps:
      # Always release from main, whatever branch the workflow was started on.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate the version against tags, branches, and the changelog
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          version = os.environ["VERSION"].strip()
          shape = re.compile(r"^\d+\.\d+\.\d+(?:(?:a|b|rc)\d+|\.dev\d+|\.post\d+)?$")
          if shape.match(version) is None:
              sys.exit(f"version {version!r} is not X.Y.Z with an optional a/b/rc/.dev/.post suffix")
          tags = subprocess.run(
              ["git", "tag", "--list", "v*"], capture_output=True, text=True, check=True
          ).stdout.split()
          if f"v{version}" in tags:
              sys.exit(f"tag v{version} already exists")

          def key(tag: str) -> tuple[int, int, int]:
              match = re.match(r"v(\d+)\.(\d+)\.(\d+)", tag)
              return tuple(int(x) for x in match.groups()) if match else (0, 0, 0)

          latest = max(tags, key=key, default="v0.0.0")
          if key(f"v{version}") < key(latest):
              sys.exit(f"version {version} is older than the latest tag {latest}")
          print(f"releasing {version} after {latest}")
          PY
          if git ls-remote --exit-code --heads origin "release/v$VERSION" >/dev/null 2>&1; then
            echo "branch release/v$VERSION already exists; close its pull request and delete it first" >&2
            exit 1
          fi
          python scripts/prepare_release.py --version "$VERSION" --check

      - name: Move [Unreleased] into the release section and render the notes
        run: |
          set -euo pipefail
          if [ -n "$SUMMARY" ]; then
            python scripts/prepare_release.py --version "$VERSION" --summary "$SUMMARY"
          else
            python scripts/prepare_release.py --version "$VERSION"
          fi
          python scripts/release_notes.py --version "$VERSION" --output /tmp/release-notes.md
          git --no-pager diff --stat

      - name: Push the release branch and open the pull request
        run: |
          set -euo pipefail
          BRANCH="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "release: v$VERSION"
          git push origin "$BRANCH"
          {
            echo "Release v$VERSION, prepared by the Release prepare workflow."
            echo
            echo "Merging this pull request tags \`v$VERSION\` on the merge commit and publishes it"
            echo "(release-tag.yml, then release.yml: PyPI through the \`release\` environment, then"
            echo "the GitHub Release). To change the notes, edit \`CHANGELOG.md\` on this branch."
            echo "To abandon the release, close this pull request and delete the branch; nothing"
            echo "has been tagged or published."
            echo
            echo "## Release notes"
            echo
            cat /tmp/release-notes.md
          } > /tmp/pr-body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "release: v$VERSION" --body-file /tmp/pr-body.md
          # A pull request opened with the workflow token does not trigger the
          # pull_request workflows; run CI on the branch explicitly instead.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          {
            echo "## Release pull request opened for v$VERSION"
            echo
            echo "CI was started on \`$BRANCH\`. Merge the pull request to tag and publish."
          } >> "$GITHUB_STEP_SUMMARY"
