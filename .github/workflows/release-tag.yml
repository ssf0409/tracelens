name: Release tag

# Second half of the release pipeline (issue #88). When the release pull
# request opened by release-prepare.yml is merged, its squash commit on main
# is titled "release: vX.Y.Z": this workflow tags that commit and hands the
# tag to release.yml, which publishes to PyPI (release environment) and
# creates the GitHub Release. Every other push to main is ignored.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: tag the release commit and publish
    if: startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag
      actions: write    # run release.yml on the tag
    env:
      GH_TOKEN: ${{ github.token }}
      MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read the version from the commit and check the changelog and tags
        id: version
        run: |
          set -euo pipefail
          TITLE="$(printf '%s\n' "$MESSAGE" | head -n1)"
          VERSION="$(printf '%s' "$TITLE" | sed -E 's/^release: v([0-9][^ ]*).*$/\1/')"
          if [ "$VERSION" = "$TITLE" ] || [ -z "$VERSION" ]; then
            echo "could not read a version from the commit title: $TITLE" >&2
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $VERSION" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists; nothing to do" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tagging v$VERSION at $GITHUB_SHA"

      - name: Create and push the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "release: v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: Publish by running release.yml on the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A tag pushed with the workflow token does not raise the tag-push
          # event (GitHub prevents workflow loops), so the dispatch is the
          # trigger; publish=true makes it a real release, not a dry run.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION" -f publish=true
          echo "tagged v$VERSION and started release.yml with publish=true" >> "$GITHUB_STEP_SUMMARY"
