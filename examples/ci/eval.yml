# Copy-paste GitHub Actions template for running TraceLens evals in CI.
#
# Place this at .github/workflows/eval.yml in YOUR project and edit the five
# placeholders marked CHANGE-ME below. The walkthrough (severity tuning, job
# summaries, artifact retention, reading the gate) lives in
# docs/ci-cd-integration.md.
#
# It installs your project from its lockfile, runs an eval suite, posts the
# Markdown report to the job summary, uploads the reports as artifacts, and
# fails CI on moderate-or-worse regressions against a stored baseline.
#
# This template assumes tracelens is a dependency of your project (so it is
# installed by `uv sync --frozen`). The baselines file must exist and parse:
# a missing --baselines-file, absent file, or corrupt JSON exits 2 BEFORE the
# eval runs (exit 1 = the gate blocked on a regression, exit 2 after the run
# = the gate could not be evaluated). Create eval/baselines.json before
# enabling this workflow, and add --require-baselines to also fail when a
# task has no stored baseline instead of warning and skipping it.

name: TraceLens Evaluation

on:
  pull_request:
    branches: [main]
    # Every pull request is evaluated by default so agent code changes never
    # skip the eval. To narrow it, uncomment and list the paths whose changes
    # should trigger an eval -- include your agent's source directories.
    #   paths:
    #     - "app/**"      # CHANGE-ME: your agent's source
    #     - "eval/**"
    #     - "pyproject.toml"
    #     - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        run: uv python install 3.12

      # --frozen installs exactly what uv.lock records, so CI evaluates the
      # same dependency set you tested locally.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run TraceLens
        run: |
          uv run --frozen tracelens run \
            --eval-set eval/tasks.json \
            --adapter myproject.eval.adapters.CIAgentAdapter \
            --graders myproject.eval.graders.CIQualityGrader \
            --num-runs 5 \
            --baseline-check \
            --baselines-file eval/baselines.json \
            --fail-on-regression moderate \
            --output eval/results/results.json \
            --report eval/results/report.md \
            --html-report eval/results/report.html \
            --save-trials eval/results/trials.json
        # CHANGE-ME (5 placeholders):
        #   --eval-set        path to your eval set (tasks)
        #   --adapter         dotted import path to your AgentAdapter subclass
        #   --graders         dotted import path(s) to your graders
        #   --baselines-file  path to your stored baselines
        #   --fail-on-regression  minor | moderate | severe
        #                         (lower = stricter gate; see ci-cd-integration.md)

      # The report exists only after a successful preflight; a missing file
      # must not turn a clear TraceLens error into a `cat` failure.
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f eval/results/report.md ]; then
            cat eval/results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No TraceLens report was written; see the run step for the error." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracelens-results
          if-no-files-found: ignore
          path: |
            eval/results/results.json
            eval/results/report.md
            eval/results/report.html
            eval/results/trials.json
